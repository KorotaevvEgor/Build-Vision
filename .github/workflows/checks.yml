name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: node --experimental-strip-types --test tests/*.test.ts
      - run: npm run build
  domain:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: backend
      DJANGO_SETTINGS_MODULE: admin_panel.test_settings
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            admin_panel/requirements.txt
      - run: pip install -r requirements-ci.txt
      - run: python -m pytest backend/tests/test_matching_rules.py backend/tests/test_work_evidence.py -q
      - run: python manage.py test core.tests.test_independent_evidence --settings=admin_panel.test_settings
