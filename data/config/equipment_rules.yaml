# Правила соответствия техники этапам работ.
#
# Это настраиваемые технологические предположения для демонстрационных
# сценариев, а не общеобязательные строительные нормы. required — то,
# что должно быть видно на этапе; allowed — техника, которая не считается
# отклонением, если присутствует, но не обязательна; классы вне
# required+allowed всех активных этапов зоны — потенциально неожиданная
# техника.
#
# class_key должен совпадать с data/config/vocabulary.yaml.

version: 1
stage_rules:
  stage-kotlovan:
    work_name: Устройство котлована
    required:
      excavator: 1
      dump_truck: 3
    allowed:
      - mobile_crane   # может понадобиться для вспомогательных операций
    alternatives_note: >
      При другой согласованной технологии (например, погрузчик вместо
      части рейсов самосвала) отклонение не объявляется автоматически —
      только помечается для проверки инженером.

  stage-beton-podgotovka:
    work_name: Устройство бетонной подготовки
    required:
      concrete_mixer: 1
    allowed:
      - truck
    alternatives_note: >
      Локальное приготовление бетона на площадке в сценарий не входит;
      при обнаружении такого варианта — статус «Недостаточно данных»,
      не «нарушение».

  stage-uplotnenie-grunta:
    work_name: Уплотнение грунта
    required:
      road_roller: 1
    allowed:
      - bulldozer   # планировка перед уплотнением
    alternatives_note: >
      Ручное уплотнение малых участков виброплитой не входит в
      таксономию детектора — такие случаи не проверяются автоматически.

  # Укрупнённых работ («Подземная часть», «Устройство фундамента»,
  # «Благоустройство территории») здесь нет намеренно: у раздела графика нет
  # собственной технологии, проверять по составу техники нужно только листовые работы.

  stage-armokarkas:
    work_name: Устройство армокаркаса фундаментной плиты
    required:
      mobile_crane: 1
    allowed:
      - truck            # подвоз арматурных каркасов
      - crane_manipulator
    alternatives_note: >
      Вязка каркаса на месте без крана технически возможна и не является
      нарушением — отсутствие крана требует проверки, а не автоматического вывода.

  stage-betonirovanie-plity:
    work_name: Бетонирование фундаментной плиты
    required:
      concrete_mixer: 2
    allowed:
      - mobile_crane
      - truck
    alternatives_note: >
      Подача бетона бадьёй вместо автобетононасоса допустима; автобетононасос
      в таксономии детектора отсутствует и автоматически не проверяется.

  stage-osnovanie-proezdov:
    work_name: Устройство основания проездов
    required:
      road_roller: 1
      dump_truck: 1
    allowed:
      - bulldozer
      - excavator
    alternatives_note: >
      Порядок отсыпки и число рейсов зависят от организации работ;
      единичный снимок без самосвала не доказывает остановки работ.

  stage-asfaltirovanie:
    work_name: Устройство асфальтобетонного покрытия проездов
    required:
      road_roller: 1
    allowed:
      - dump_truck      # подвоз асфальтобетонной смеси
      - truck
    alternatives_note: >
      Асфальтоукладчик в таксономию детектора не входит — его наличие
      автоматически не проверяется, это зафиксированное ограничение.

# Статусы результата проверки одного снимка по одному этапу/зоне.
# Формируются кодом, а не хранятся здесь — перечислены для справки.
statuses:
  - key: no_deviation
    label_ru: Отклонений по проверяемым признакам не выявлено
  - key: possible_deviation
    label_ru: Возможное отклонение
  - key: insufficient_data
    label_ru: Недостаточно данных

# Когда присваивается insufficient_data (пункт 7 методики):
insufficient_data_when:
  - "нет подтверждённой даты снимка"
  - "для зоны/периода нет активного этапа с правилом"
  - "топ-2 класса детекции по уверенности близки (см. ambiguity_margin)"
  - "зона на снимке не подтверждена как полностью просматриваемая"

# Порог близости уверенности между топ-1 и топ-2 классом одной рамки,
# при котором классификация считается неоднозначной (см. baseline:
# экскаватор/кран-манипулятор путаются в zero-shot YOLO-World).
ambiguity_margin: 0.15
confusable_class_pairs:
  - [excavator, crane_manipulator]
  - [mobile_crane, crane_manipulator]
  - [road_roller, crane_manipulator]  # подтверждено разметкой val-выборки (Screenshot_60): реальный каток уверенно назван краном-манипулятором

# Ограничения, не покрываемые механизмом confusable-пар (не путаница между
# двумя классами таксономии, а систематические ложные/пропущенные срабатывания
# на одном классе). См. docs/detector_quality_report.md.
known_limitations:
  - class_key: dump_truck
    label_ru: Самосвал
    issue: low_precision
    description: >
      На val-выборке (20 снимков) precision класса «Самосвал» около 0.05:
      промпт уверенно срабатывает на трубах, панелях, контейнерах и другом
      прямоугольном фоне. Автоматические предупреждения по этому классу
      требуют повышенной ручной проверки.
  - class_key: concrete_mixer
    label_ru: Автобетоносмеситель
    issue: low_recall
    description: >
      На val-выборке класс не был правильно назван ни разу при 2
      подтверждённых случаях присутствия — недостаточно примеров для
      точной оценки, но результат систематический, не случайный.
